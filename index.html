<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore the most starred GitHub repositories created each day, week, month or year." />
    <meta name="theme-color" content="#f1f1f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <title>GitHunt – Most starred projects on GitHub</title>
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('githunt:theme') || '"system"');
          var dark = stored === 'dark' || (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QD7PX9C379"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-QD7PX9C379');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
